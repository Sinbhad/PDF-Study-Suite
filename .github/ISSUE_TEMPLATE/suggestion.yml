name: Suggest an improvement
description: An idea that would make studying with this easier.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like the app to do?
      placeholder: "It would help if the flashcards could..."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: What are you trying to do when you run into this?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app
      options:
        - Summary
        - Flashcards
        - Quiz or practice test
        - Reader
        - Opening and reading PDFs
        - Look and feel
        - Something new
    validations:
      required: false
